# Demo: the crowd-dj image at http://127.0.0.1:8080 (just demo; other port: DEMO_PORT=18080). The
# pages work without a Spotify app; signing in needs your own: set SPOTIFY_CLIENT_ID and
# SPOTIFY_CLIENT_SECRET (e.g. in .env) and add http://127.0.0.1:8080/auth/callback as a redirect URI
# to the app. The database lives in the volume "data"; "docker compose down -v" starts afresh. For a
# real installation see deploy/compose.yaml.
name: crowd-dj-demo

services:
    crowd-dj:
        build: .
        image: crowd-dj:demo
        environment:
            ORIGIN: http://127.0.0.1:${DEMO_PORT:-8080}
            SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-demo-client-id}
            SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-demo-client-secret}
            APP_SECRET: demo-only-not-a-secret-demo-only-not-a-secret
            TZ: Europe/Berlin
        ports:
            - 127.0.0.1:${DEMO_PORT:-8080}:3000
        volumes:
            - data:/data
        # The same hardening as deploy/compose.yaml
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true

volumes:
    data:
