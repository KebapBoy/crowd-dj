# crowd-dj for a real installation behind a reverse proxy (see README, "Running").
# Use it as it is, e.g. as a Dockhand git stack with compose path deploy/compose.yaml, and set the
# variables below in the environment of the stack (keys and comments: .env.example). The stack
# follows main with auto-update off; "just deploy" (dev-kit deploy) deploys a release through the
# stack's webhook.
services:
    crowd-dj:
        build: ..
        image: crowd-dj:local
        restart: unless-stopped
        environment:
            TZ: ${TZ:-UTC}
            # Public URL, e.g. https://dj.example.com; the Spotify redirect URI is <ORIGIN>/auth/callback
            ORIGIN: ${ORIGIN:?set ORIGIN}
            SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?set SPOTIFY_CLIENT_ID}
            SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?set SPOTIFY_CLIENT_SECRET}
            APP_SECRET: ${APP_SECRET:?set APP_SECRET}
            # Header with the visitor's address and the number of proxies that append to it
            ADDRESS_HEADER: ${ADDRESS_HEADER:-X-Forwarded-For}
            XFF_DEPTH: ${XFF_DEPTH:-1}
        volumes:
            # SQLite database (accounts with encrypted tokens, profiles, pools, sessions)
            - data:/data
        # Hardening: read-only image (state only in /data, scratch in /tmp), no capabilities,
        # no gaining privileges
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        networks:
            - proxy
        # No published port: only the reverse proxy talks to it (port 3000)

volumes:
    data:

networks:
    # The network your reverse proxy is in
    proxy:
        name: ${CROWD_DJ_PROXY_NETWORK:-proxy}
        external: true
